<!doctype html>
<html lang="en" data-ready="loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waxwing — a player for your music, and the world’s wax</title>
  <meta name="description" content="Waxwing in the browser. Your own files, Apple previews and full archive.org recordings under one queue — nothing uploaded, no account, no install." />
  <meta name="theme-color" content="#12100e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="app.css" />
</head>

<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar" role="banner">
    <div class="brand" role="heading" aria-level="2">
      <span class="brand-mark" aria-hidden="true">I</span>
      <span class="brand-name">WAXWING</span>
      <span class="brand-tag">your files, the world’s wax</span>
    </div>
    <div class="topbar-actions" role="search" aria-label="Player actions">
      <label class="field search">
        <input id="search" type="search" placeholder="Search — your library and the world’s wax" autocomplete="off" />
      </label>
      <button id="import-btn" class="btn" aria-label="Add music">Add music</button>
      <button id="yt-btn" class="btn ghost" aria-label="Add YouTube link">Add link</button>
      <button id="demo-btn" class="btn ghost" aria-label="Play demo track">Play the demo</button>
      <input id="file-input" type="file" accept="audio/*,.lrc" multiple hidden />
      <label for="file-input" class="btn ghost" style="display:none;" aria-label="Drop music here">Drop music</label>
    </div>
  </header>

  <main class="stage">
    <section class="library-panel" aria-label="Library">
      <div class="panel-head">
        <h2>Library</h2>
        <span id="library-count" class="muted">0 tracks</span>
      </div>

      <div id="empty" class="empty">
        <p class="empty-title">Drop music anywhere</p>
        <p class="empty-body">
          MP3, FLAC, OGG, M4A, WAV. Tags and cover art are read in the browser —
          the files never leave this machine.
        </p>
      </div>

      <ul id="library" class="library" role="list"></ul>
    </section>
  </main>
</body>
</html>
