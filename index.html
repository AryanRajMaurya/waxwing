<!doctype html>
<html lang="en" data-ready="loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waxwing</title>
  <meta name="description" content="Your music, the world’s wax. In the browser. No uploads. No install." />
  <meta name="theme-color" content="#0c0a09" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="app.css" />
</head>

<body>
  <div class="ambient" aria-hidden="true"></div>

  <nav class="topbar" role="navigation">
    <div class="brand" role="heading" aria-level="1">
      <span class="brand-mark" aria-hidden="true">I</span>
      <span class="brand-name">WAXWING</span>
      <span class="brand-tag">your files, the world’s wax</span>
    </div>
    <div class="topbar-actions" role="search">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search library or paste a link" autocomplete="off" />
      </div>
      <div class="action-buttons">
        <button class="btn import">Add music</button>
        <button class="btn ghost import-link">Add link</button>
        <button class="btn ghost play-demo">Demo</button>
      </div>
      <input id="file-input" type="file" accept="audio/*,.lrc" multiple hidden />
      <label for="file-input" class="btn ghost reveal">Drop music</label>
    </div>
  </nav>

  <div class="main">
    <section class="library" aria-label="Library">
      <header class="library-header">
        <h2>Library</h2>
        <span class="library-count">0 tracks</span>
      </header>

      <div class="empty-state">
        <span class="empty-icon">🎵</span>
        <h3>Drop music anywhere</h3>
        <p>MP3, FLAC, OGG, M4A, WAV. Tags and cover art are read in the browser — the files never leave this machine.</p>
      </div>

      <ul class="library-list"></ul>
    </section>
  </div>
</body>
</html>
