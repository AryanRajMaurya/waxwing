name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright's Chromium
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Serve the player
        run: python3 -m http.server 8000 --bind 127.0.0.1 &
      - name: Wait for the server
        run: sleep 2
      - name: Browser smoke test
        run: node tools/verify-ui.mjs
